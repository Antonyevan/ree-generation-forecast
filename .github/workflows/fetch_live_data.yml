name: Fetch Live Solar Data

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch latest live data
        run: python3 fetch_live_data.py
        env:
          ESIOS_API_TOKEN: ${{ secrets.ESIOS_API_TOKEN }}
      - name: Commit and push updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/live_solar_cache.json
          git diff --staged --quiet || git commit -m "Auto-update live solar data cache"
          git push

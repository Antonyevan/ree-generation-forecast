name: Run Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

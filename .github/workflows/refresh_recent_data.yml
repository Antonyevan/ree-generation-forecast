name: Refresh Recent Training Data

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Pull latest year of data
        run: python3 pull_recent_data.py
        env:
          ESIOS_API_TOKEN: ${{ secrets.ESIOS_API_TOKEN }}
      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/recent_solar_data.json
          git diff --staged --quiet || git commit -m "Weekly refresh: recent training data"
          git push
